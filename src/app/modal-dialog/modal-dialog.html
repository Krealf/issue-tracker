<dialog class="task-dialog" #taskDialog aria-label="Task">
  <form class="task-dialog__close-form" method="dialog">
    <button class="task-dialog__close" type="submit" aria-label="Close dialog">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path
          d="M3 3L13 13M13 3L3 13"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </form>

  <div class="task-dialog__content">
    <ng-content />
  </div>
</dialog>
