<label class="toggle-switch">
  <input
    class="toggle-switch__input"
    type="checkbox"
    role="switch"
    aria-label="Dark theme"
    [checked]="checked()"
    (change)="toggle()"
  />

  <span class="toggle-switch__track" aria-hidden="true">
    <span class="toggle-switch__thumb"></span>
  </span>
</label>
