<section class="task-create" aria-labelledby="task-create-title">
  <h2 class="task-create__title" id="task-create-title">Add New Task</h2>

  <div class="task-create__fields">
    <div class="task-create__field">
      <label class="task-create__label" for="task-title"> Title </label>

      <input
        class="task-create__control"
        id="task-title"
        name="title"
        type="text"
        placeholder="e.g. Take coffee break"
        [(ngModel)]="taskTitle"
      />

      @if (!taskTitle.trim()) {
        <p class="task-create__message">Поле не должно быть пустым.</p>
      }
    </div>

    <div class="task-create__field">
      <label class="task-create__label" for="task-description"> Description </label>

      <textarea
        class="task-create__control task-create__control--textarea"
        id="task-description"
        name="description"
        rows="4"
        placeholder="e.g. It's always good to take a break. This 15 minute break will recharge the batteries a little."
        [(ngModel)]="taskDescription"
      ></textarea>
    </div>

    <fieldset class="task-create__subtasks">
      <legend class="task-create__label">Subtasks</legend>

      <div class="task-create__subtask-list">
        @for (subtask of subtasks; track subtask.id) {
          <div class="task-create__subtask">
            <label class="sr-only" for="task-subtask-{{ subtask.id }}"> Subtask {{ subtask.id }} </label>

            <input
              class="task-create__control"
              id="task-subtask-{{ subtask.id }}"
              name="subtask-{{ subtask.id }}"
              type="text"
              placeholder="e.g. Make coffee"
              [(ngModel)]="subtask.title"
            />

            <button
              class="task-create__remove"
              type="button"
              aria-label="Remove subtask {{ subtask.id }}"
              (click)="removeSubtask(subtask.id)"
              [disabled]="subtasks.length === 1"
            >
              <svg width="15" height="15" fill="none" aria-hidden="true">
                <g fill="currentColor" fill-rule="evenodd">
                  <path d="m12.728 0 2.122 2.122L2.122 14.85 0 12.728z" />
                  <path d="M0 2.122 2.122 0 14.85 12.728l-2.122 2.122z" />
                </g>
              </svg>
            </button>
          </div>
        }
      </div>

      <button class="task-create__button task-create__button--secondary" type="button" (click)="addNewSubtask()" [disabled]="subtasks.length === 5">
        + Add New Subtask
      </button>
    </fieldset>

    <div class="task-create__field">
      <label class="task-create__label" for="task-status"> Status </label>

      <select
        class="task-create__control task-create__control--select"
        id="task-status"
        name="status"
        [(ngModel)]="taskStatus"
      >
        <option value="todo">Todo</option>
        <option value="doing">Doing</option>
        <option value="done">Done</option>
      </select>
    </div>

    <button
      class="task-create__button task-create__button--primary"
      type="button"
      (click)="createTask()"
      [disabled]="!taskTitle.trim()"
    >
      Create Task
    </button>
  </div>
</section>
